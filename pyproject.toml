[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unknown-program-analysis"
version = "0.1.0"
description = "Intelligent Analysis of Unknown Program Behaviour - Stage 1: Input and Submission"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "cryptography>=42.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.3",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
include = ["app*", "worker*"]

# ---------------------------------------------------------------------------
# Testing
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "unit: isolated tests of a single component",
    "contract: suites every implementation of a protocol must pass",
    "integration: tests running the API against a real database",
    "acceptance: one test per numbered acceptance criterion",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py", "*/__init__.py"]

[tool.coverage.report]
show_missing = true

# The gate. 90 rather than 100: the last few percent are reached by testing
# error paths that cannot be provoked without contorting the code, and a target
# that can only be met by writing tests for the sake of the number stops
# measuring anything.
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # Protocol method bodies. There is nothing to execute, and the
    # implementations behind them are covered by their contract suites.
    '^\s*\.\.\.$',
]

# ---------------------------------------------------------------------------
# Linting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
# The migrations directory is called "alembic", so import sorting would
# otherwise take the alembic package for a local module.
known-third-party = ["alembic"]

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["app", "worker"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
